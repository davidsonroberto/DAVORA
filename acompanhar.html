<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Acompanhe seu pedido | DAVORA</title>
  <link rel="stylesheet" href="assets/store.css">
  <link rel="stylesheet" href="assets/tracking.css">
  <script type="module" src="assets/tracking.js"></script>
</head>
<body>
  <header><div class="header-main"><a class="logo" href="/" aria-label="DAVORA, início">DAVORA<span>.</span></a><a class="text-link" href="/">Voltar à loja</a></div></header>
  <main class="tracking-page">
    <section class="info-box">
      <span class="section-kicker">SEU PEDIDO NA DAVORA</span>
      <h1>Acompanhe sua entrega</h1>
      <p id="trackingReference"></p>
      <p id="trackingMessage" role="status" aria-live="polite">Conferindo as informações do pedido…</p>
      <dl id="shipmentDetails" hidden><dt>Transportadora</dt><dd id="trackingCarrier"></dd><dt>Código de rastreamento</dt><dd id="trackingCode"></dd><dt>Última atualização</dt><dd id="trackingUpdated"></dd></dl>
      <div id="shipmentList" hidden></div>
      <button id="refreshTracking" class="primary" type="button">Atualizar acompanhamento</button>
      <p class="foot-note">Guarde este link para consultar seu pedido. Ele é pessoal e tem validade de até 90 dias.</p>
      <p><a class="text-link" id="trackingSupport" href="https://wa.me/5531991339648" target="_blank" rel="noopener noreferrer">Precisa de ajuda? Fale com a DAVORA ↗</a></p>
    </section>
  </main>
</body>
</html>
